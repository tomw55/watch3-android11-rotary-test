# Isolated QEMU fixture policy, NOT an Android/Watch3 production policy.
# A single fixture domain intentionally covers init, servicemanager and clients.
# Only the two explicitly named positive service types may be added/found.
class security
class file
class dir
class chr_file
class lnk_file
class fifo_file
class sock_file
class process
class fd
class unix_dgram_socket
class binder
class service_manager
sid kernel
sid security
sid unlabeled

class security { compute_av compute_create compute_member check_context load_policy compute_relabel compute_user setenforce setbool setsecparam setcheckreqprot read_policy validate_trans }
class file { ioctl read write create getattr setattr lock append execute execute_no_trans entrypoint open }
class dir { read write create getattr open search add_name remove_name }
class lnk_file { read getattr }
class chr_file { ioctl read write open getattr }
class fifo_file { ioctl read write create open getattr }
class sock_file { read write open getattr }
class process { transition dyntransition fork sigchld sigkill sigstop signull signal getsched setsched getpgid getattr }
class fd { use }
class unix_dgram_socket { create read write ioctl getattr bind connect getopt setopt shutdown sendto recvfrom }
class binder { impersonate call set_context_mgr transfer }
class service_manager { add find list }

sensitivity s0;
dominance { s0 }
level s0;
mlsconstrain file { read write } (l1 eq l2);
type kernel_t;
type security_t;
type root_t;
type watch3_test_service_t;
type watch3_manager_service_t;
type watch3_denied_service_t;
role r;
role r types kernel_t;

allow kernel_t root_t:dir { search read open getattr };
allow kernel_t root_t:file { ioctl read open getattr execute execute_no_trans entrypoint };
allow kernel_t root_t:chr_file { ioctl read write open getattr };
allow kernel_t root_t:lnk_file { read getattr };
allow kernel_t root_t:fifo_file { read write };
allow kernel_t root_t:sock_file { read write open getattr };
allow kernel_t security_t:dir { search read open getattr };
allow kernel_t security_t:file { read write open getattr };
allow kernel_t security_t:security { compute_av check_context load_policy read_policy };
allow kernel_t self:process { fork sigchld sigkill sigstop signull signal getsched setsched getpgid getattr };
allow kernel_t self:fifo_file { ioctl read write create open getattr };
allow kernel_t self:unix_dgram_socket { create read write ioctl getattr bind connect getopt setopt shutdown sendto recvfrom };
allow kernel_t self:fd use;
allow kernel_t self:binder { call set_context_mgr transfer };
allow kernel_t self:service_manager list;
allow kernel_t { watch3_test_service_t watch3_manager_service_t }:service_manager { add find };
# Deliberately no add/find rule for watch3_denied_service_t.

user u roles r level s0 range s0;
sid kernel u:r:kernel_t:s0
sid security u:object_r:security_t:s0
sid unlabeled u:object_r:root_t:s0

genfscon rootfs / u:object_r:root_t:s0
genfscon sysfs / u:object_r:root_t:s0
genfscon selinuxfs / u:object_r:security_t:s0
genfscon devtmpfs / u:object_r:root_t:s0
genfscon proc / u:object_r:root_t:s0
