name: Samsung 4.9 Android 11 graphics image integration
on:
  push:
    branches: [test/android11-system-integration]
    paths: ['ci/arm64-reference/**', 'ci/graphics-hidl/**', '.github/workflows/android11-system-integration.yml']
permissions:
  contents: read
  actions: read
jobs:
  init:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Download immutable passing graphics components
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 44379899922
          name: android11-graphics-44379899922
          path: graphics-evidence
      - name: Download exact combined kernel and executed reference gates
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 44402685525
          name: android11-system-44402685525
          path: combined-kernel-reference
      - name: Verify retained artifacts and pure configuration transforms
        run: |
          python3 ci/graphics-hidl/verify-package.py "$GITHUB_WORKSPACE/graphics-evidence"
          python3 ci/graphics-hidl/verify-kernel.py "$GITHUB_WORKSPACE/combined-kernel-reference" "$GITHUB_WORKSPACE/samsung-virt-evidence"
          python3 ci/graphics-hidl/test-vendor-config.py
      - name: Install image inspection and QEMU tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xz-utils android-sdk-libsparse-utils e2fsprogs binutils fdisk cpio qemu-system-arm unzip file
      - name: Exercise actual ext4 overlay on a synthetic host fixture
        run: python3 ci/graphics-hidl/test-overlay.py "$GITHUB_WORKSPACE/graphics-evidence/servicemanager-binary/composer-package"
      - name: Attempt Android 11 ARM64 init once using the retained Samsung kernel
        run: |
          GRAPHICS_PACKAGE_DIR="$GITHUB_WORKSPACE/graphics-evidence/servicemanager-binary/composer-package" FRAMEWORK_SYSCALL_DIAG=1 TRY_RANCHU_QEMU=1 SAMSUNG_INIT_KERNEL="$GITHUB_WORKSPACE/samsung-virt-evidence/Image" bash ci/arm64-reference/inspect.sh
      - name: Require actual Android framework completion
        if: always()
        run: python3 ci/arm64-reference/check-framework.py arm64-reference-evidence/serial.log
      - name: Upload kernel identity and complete boot evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android11-system-${{ github.run_id }}
          path: |
            samsung-virt-evidence/
            arm64-reference-evidence/
