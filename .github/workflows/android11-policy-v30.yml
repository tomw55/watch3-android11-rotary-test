name: Android 11 reference policy version 30
on:
  push:
    branches: [test/android11-policy-v30]
    paths: ['ci/policy-v30/**', '.github/workflows/android11-policy-v30.yml']
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update
          sudo apt-get install -y libpulse0
      - run: bash ci/policy-v30/run.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android11-policy-v30-${{ github.run_id }}
          path: ci/policy-v30/evidence/
