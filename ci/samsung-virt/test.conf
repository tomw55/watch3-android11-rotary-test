class security
class file
class dir
class chr_file
class process
sid kernel
sid security
sid unlabeled

class security { compute_av compute_create compute_member check_context load_policy compute_relabel compute_user setenforce setbool setsecparam setcheckreqprot read_policy validate_trans }
class file { read write open getattr execute entrypoint }
class dir { search read open getattr }
class chr_file { read write open getattr }
class process { transition dyntransition }

type kernel_t;
type security_t;
type root_t;
type denied_t;
role system_r;
role system_r types kernel_t;

allow kernel_t root_t:dir { search read open getattr };
allow kernel_t root_t:file { read open getattr };
allow kernel_t security_t:dir { search read open getattr };
allow kernel_t security_t:file { read open getattr };

allow kernel_t root_t:chr_file { read write open getattr };

user system_u roles system_r;

sid kernel system_u:system_r:kernel_t
sid security system_u:object_r:security_t
sid unlabeled system_u:object_r:root_t

genfscon rootfs / system_u:object_r:root_t
genfscon sysfs / system_u:object_r:root_t
genfscon sysfs /devices/system/cpu/possible system_u:object_r:denied_t
genfscon selinuxfs / system_u:object_r:security_t
genfscon devtmpfs / system_u:object_r:root_t
