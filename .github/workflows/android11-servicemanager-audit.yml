name: Android 11 servicemanager source and dependency audit
on:
  push:
    branches: [test/binder-android11-adaptation]
    paths:
      - '.github/workflows/android11-servicemanager-audit.yml'
      - 'ci/binder-adaptation/servicemanager-audit.sh'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Fetch pinned Android 11 servicemanager source and record dependencies
        run: bash ci/binder-adaptation/servicemanager-audit.sh
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android11-servicemanager-audit-${{ github.run_id }}
          path: servicemanager-audit/
