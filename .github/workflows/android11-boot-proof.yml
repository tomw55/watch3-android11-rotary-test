name: Android 11 boot and input preflight
on:
  workflow_dispatch:
    inputs:
      check_input:
        description: Check guest uinput and IDC selection after boot
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  api30:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install emulator host libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse0
      - name: Boot disposable API 30 guest and check capabilities
        shell: bash
        env:
          CHECK_INPUT: ${{ inputs.check_input }}
        run: bash ci/android11/run-ci.sh
      - name: Upload diagnostics even if a check failed
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android11-boot-proof
          path: ci/android11/evidence/
          if-no-files-found: warn
          retention-days: 7
